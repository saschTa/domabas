name: CI and releases

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  checks:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: '3.53.1'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/setup-flutter.ts') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock', 'scripts/ci/setup-flutter.ts') }}
      - run: task ci:flutter
      - run: task setup
      - run: task check

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_USER: domabas_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: domabas_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U domabas_ci -d domabas_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: '3.53.1'
      - run: task ci:database
        env:
          TEST_DATABASE_URL: postgres://domabas_ci:disposable_ci_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/domabas_ci?sslmode=disable
      - run: task test:integration
        env:
          TEST_DATABASE_URL: postgres://domabas_ci:disposable_ci_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/domabas_ci?sslmode=disable
      - run: task generate:db:check
        env:
          TEST_DATABASE_URL: postgres://domabas_ci:disposable_ci_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/domabas_ci?sslmode=disable

  dependencies:
    name: Dependency vulnerabilities
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: '3.53.1'
      - run: task security:dependencies

  release:
    name: Publish containers
    needs: [checks, integration, dependencies]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      pull-requests: read
    concurrency:
      group: domabas-container-releases
      queue: max
      cancel-in-progress: false
    env:
      DOCKER_CONFIG: /tmp/domabas-docker-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: '3.53.1'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.37.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/trivy/db
          key: trivy-db-${{ runner.os }}-${{ hashFiles('scripts/security/scan-image.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: trivy-db-${{ runner.os }}-${{ hashFiles('scripts/security/scan-image.ts') }}-
      - run: task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain image vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-vulnerabilities-${{ github.run_attempt }}
          path: .cache/image-scans/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Cache the vulnerability database after scanning
        if: always() && hashFiles('.cache/trivy/db/metadata.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/trivy/db
          key: trivy-db-${{ runner.os }}-${{ hashFiles('scripts/security/scan-image.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
