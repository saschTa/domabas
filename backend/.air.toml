root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go", "sql", "toml"]
include_file = [".env"]
exclude_dir = ["tmp", "tests"]
exclude_regex = ["_test.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "45s"

[build.windows]
cmd = "go build -o ./tmp/server.exe ./cmd/server"
entrypoint = ["tmp\\server.exe"]

[log]
time = true

[misc]
clean_on_exit = true
