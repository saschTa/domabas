name: domabas

x-init: &init
  build:
    context: .
    dockerfile: infra/init/Dockerfile
  restart: "no"

x-database-environment: &database-environment
  POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-domabas_admin}
  POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-domabas_admin_local}
  POSTGRES_DB: ${POSTGRES_DB:-domabas}
  POSTGRES_USER: ${POSTGRES_USER:-domabas}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domabas}

services:
  postgres:
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-domabas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-domabas_admin_local}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 30s

  database-init:
    <<: *init
    command: [databases]
    environment: *database-environment
    depends_on:
      postgres: {condition: service_healthy}

  model-init:
    <<: *init
    command: [embedding-model]
    environment:
      EMBEDDING_DOWNLOAD_ALLOWED: ${EMBEDDING_DOWNLOAD_ALLOWED:-true}
    volumes:
      - embedding_models:/models/embedding

  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
    command: ["--model", "/models/embedding/nomic-embed-text-v1.5.f16.gguf", "--alias", "nomic-embed-text:v1.5", "--embedding", "--pooling", "mean", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "2048", "--batch-size", "2048", "--ubatch-size", "2048", "--parallel", "1"]
    depends_on:
      model-init: {condition: service_completed_successfully}
    volumes:
      - embedding_models:/models/embedding:ro
    cpus: ${EMBEDDING_CPUS:-4}
    mem_limit: ${EMBEDDING_MEMORY_LIMIT:-2g}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8080/health]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  document-processor:
    build:
      context: .
      dockerfile: infra/document-processor/Dockerfile
    environment:
      HTTP_ADDR: 0.0.0.0:8091
      MODEL_CACHE_ROOT: /models/tesseract
      EMBEDDING_MODEL_PATH: /models/embedding/nomic-embed-text-v1.5.f16.gguf
      EMBEDDING_URL: http://embeddings:8080
      EMBEDDING_QUEUE_SIZE: ${EMBEDDING_QUEUE_SIZE:-128}
    ports:
      - "${PRIVATE_BIND_ADDRESS:-127.0.0.1}:${DOCUMENT_PROCESSOR_PORT:-8091}:8091"
    volumes:
      - tesseract_models:/models/tesseract
      - embedding_models:/models/embedding:ro
    tmpfs:
      - /tmp:size=2147483648,mode=1777
    cpus: ${DOCUMENT_PROCESSOR_CPUS:-4}
    mem_limit: ${DOCUMENT_PROCESSOR_MEMORY_LIMIT:-4g}
    pids_limit: 256
    depends_on:
      embeddings: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8091/readyz]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10m
    stop_grace_period: 30s

  backend:
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: host=postgres port=5432 sslmode=disable
      PGUSER: ${POSTGRES_USER:-domabas}
      PGPASSWORD: ${POSTGRES_PASSWORD:-domabas}
      PGDATABASE: ${POSTGRES_DB:-domabas}
      HTTP_ADDR: 0.0.0.0:8080
      GOMEMLIMIT: ${BACKEND_GOMEMLIMIT:-1536MiB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:7357,http://127.0.0.1:7357}
      DOCUMENT_INGESTION_CONCURRENCY: ${DOCUMENT_INGESTION_CONCURRENCY:-1}
      DOCUMENT_AI_CONCURRENCY: ${DOCUMENT_AI_CONCURRENCY:-1}
      EMBEDDING_QUEUE_SIZE: ${EMBEDDING_QUEUE_SIZE:-128}
      LLM_CREDENTIAL_KEY: ${LLM_CREDENTIAL_KEY:-}
      LLM_CREDENTIAL_KEY_FILE: /var/lib/domabas/secrets/llm.key
      DOCUMENT_PROCESSOR_URL: http://document-processor:8091
      DOCUMENT_INGESTION_ROOT: /data/ingestion
      DOCUMENT_STORAGE_ROOT: /data/documents
      EMAIL_CREDENTIAL_KEYS: ${EMAIL_CREDENTIAL_KEYS:-}
      EMAIL_CREDENTIAL_KEY_FILE: /var/lib/domabas/secrets/email.key
      PAPERLESS_CREDENTIAL_KEY: ${PAPERLESS_CREDENTIAL_KEY:-}
      PAPERLESS_CREDENTIAL_KEY_FILE: /var/lib/domabas/secrets/paperless.key
      EMAIL_CREDENTIAL_ACTIVE_KEY_ID: ${EMAIL_CREDENTIAL_ACTIVE_KEY_ID:-}
      EMAIL_IMAP_ALLOWED_HOSTS: ${EMAIL_IMAP_ALLOWED_HOSTS:-}
      EMAIL_IMAP_CA_FILE: ${EMAIL_IMAP_CA_FILE:-}
    volumes:
      - document_ingestion:/data/ingestion
      - document_storage:/data/documents
      - credential_keys:/var/lib/domabas/secrets
    depends_on:
      database-init: {condition: service_completed_successfully}
      document-processor: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8080/readyz]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 3
      start_period: 10m
    stop_grace_period: 60s

  web:
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/healthz]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  document_ingestion:
  document_storage:
  credential_keys:
  tesseract_models:
  embedding_models:
    name: ${EMBEDDING_MODEL_VOLUME:-${COMPOSE_PROJECT_NAME:-domabas}_embedding_models}
    external: ${EMBEDDING_MODEL_EXTERNAL_VOLUME:-false}
