openapi: 3.0.3
info:
  title: Domabas API
  version: 0.5.0
  description: >-
    Namespace-scoped documents, durable file ingestion, OCR, semantic search and local accounts with scoped permissions.
    Browser clients opt into persistent HttpOnly cookies using X-Domabas-Browser: 1 and credentialed requests.
    Cookie-affecting authentication operations require a single trusted Origin and return 403 for invalid browser origins or markers.
    HTTPS uses a Secure host-only cookie; plaintext browser persistence is restricted to loopback development.
    Only restoreSession reads cookies as authentication. Other protected operations require Authorization Bearer.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Chat
  - name: Invoices
  - name: Documents
  - name: System
  - name: Identity
  - name: Email
  - name: Realtime
paths:
  /api/v1/system/workload-settings:
    get:
      tags: [System]
      operationId: getWorkloadSettings
      summary: Inspect shared background job resources (system:workloads:manage)
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Resource limits, admitted jobs and pipeline requirements.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkloadSettings"}
        default:
          $ref: "#/components/responses/BadRequest"
    put:
      tags: [System]
      operationId: updateWorkloadSettings
      summary: Configure shared background job resources (system:workloads:manage)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateWorkloadSettingsRequest"}
      responses:
        "200":
          description: Saved settings. Running jobs keep their reservations when limits decrease.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkloadSettings"}
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/chat/configuration:
    get:
      tags:
        - Chat
      operationId: getChatConfiguration
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConfigurationSummary"
        default:
          $ref: "#/components/responses/BadRequest"
      summary: Read the chat model and availability without provider secrets
  /api/v1/system/chat/configuration:
    get:
      tags:
        - Chat
      operationId: getChatAdminConfiguration
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConfiguration"
        default:
          $ref: "#/components/responses/BadRequest"
      summary: Read independent AI chat settings (system:chat:manage)
    put:
      tags:
        - Chat
      operationId: updateChatConfiguration
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConfiguration"
        default:
          $ref: "#/components/responses/BadRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatConfigurationRequest"
      summary: Update AI chat for future turns without changing document processing
  /api/v1/system/chat/model-context:
    get:
      tags: [Chat]
      operationId: getChatModelContext
      summary: Read an installed Ollama model context limit (system:chat:manage)
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: Verified model maximum; lookup does not download or run the model.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OllamaModelContext"}
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/system/chat/models:
    get:
      tags:
        - Chat
      operationId: listChatModels
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatModelPage"
        default:
          $ref: "#/components/responses/BadRequest"
      summary: List installed internal Ollama models
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
  /api/v1/chat/conversations:
    get:
      tags:
        - Chat
      operationId: listChatConversations
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationPage"
        default:
          $ref: "#/components/responses/BadRequest"
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      summary: List private conversations in the current library
    post:
      tags:
        - Chat
      operationId: createChatConversation
      security:
        - bearerAuth:
            []
      responses:
        "201":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        default:
          $ref: "#/components/responses/BadRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatConversationRequest"
      summary: Create a private conversation idempotently
  "/api/v1/chat/conversations/{conversationId}":
    parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Chat
      operationId: getChatConversation
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        default:
          $ref: "#/components/responses/BadRequest"
    delete:
      tags:
        - Chat
      operationId: deleteChatConversation
      security:
        - bearerAuth:
            []
      summary: Hide the private conversation and fence active turns
      responses:
        "204":
          description: Conversation deleted
        default:
          $ref: "#/components/responses/BadRequest"
  "/api/v1/chat/conversations/{conversationId}/messages":
    parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Chat
      operationId: listChatMessages
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePage"
        default:
          $ref: "#/components/responses/BadRequest"
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      description: Newest-first keyset pages. Refresh merges existing IDs; continuation preserves all older history.
    post:
      tags:
        - Chat
      operationId: sendChatMessage
      security:
        - bearerAuth:
            []
      responses:
        "202":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAcceptedTurn"
        default:
          $ref: "#/components/responses/BadRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageRequest"
      description: "Atomically save user message, assistant placeholder and durable queue intent. Reusing requestId with different content conflicts. One active turn per conversation."
  "/api/v1/chat/conversations/{conversationId}/turns/{turnId}/cancel":
    parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: turnId
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Chat
      operationId: cancelChatTurn
      security:
        - bearerAuth:
            []
      responses:
        "200":
          description: Successful chat operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        default:
          $ref: "#/components/responses/BadRequest"
      description: Fence publication immediately and return the assistant message. Owned background requests drain asynchronously. No request body.
  /api/v1/invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List extracted invoices in the current library
      description: Requires invoices:read. Exact decimal strings retain document currency. Structured provenance is not a compliance certification. Search covers extracted invoice properties only, with exact number priority, full-text and typo-tolerant matches. Quoted phrases, OR and excluded words follow document full-text search syntax and disable fuzzy fallback. Document titles and OCR content are not searched. Without sort, search uses relevance and browsing uses newest creation time. Explicit sorting uses the selected field and stable ID ties, with missing dates last in both directions. Text sorts are case-insensitive alphanumeric order. All filters combine with AND. Date bounds are inclusive; creation dates use UTC. Total bounds require currency and compare exact decimal amounts. Cursors bind the library, all filters, trimmed query and ordering.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - in: query
          name: cursor
          schema: {type: string, minLength: 1, maxLength: 32768}
        - in: query
          name: source
          schema: {type: string, enum: [structured, ai]}
        - in: query
          name: q
          description: Invoice search text. Whitespace-only text behaves like no search. Invoice number fragments are literal, not wildcard patterns.
          schema: {type: string, maxLength: 200}
        - in: query
          name: sort
          schema: {type: string, enum: [created_desc, created_asc, due_asc, due_desc, issue_asc, issue_desc, number_asc, number_desc, seller_asc, seller_desc, buyer_asc, buyer_desc]}
        - in: query
          name: number
          description: Exact number value.
          schema: {type: string, minLength: 1, maxLength: 4000}
        - in: query
          name: seller
          description: Exact seller value.
          schema: {type: string, minLength: 1, maxLength: 4000}
        - in: query
          name: buyer
          description: Exact buyer value.
          schema: {type: string, minLength: 1, maxLength: 4000}
        - in: query
          name: currency
          description: Exact currency value.
          schema: {type: string, minLength: 1, maxLength: 4000}
        - in: query
          name: typeCode
          description: Exact typeCode value.
          schema: {type: string, minLength: 1, maxLength: 4000}
        - in: query
          name: format
          description: Exact format value.
          schema: {type: string, minLength: 1, maxLength: 4000}
        - in: query
          name: paymentMeansCode
          description: Exact paymentMeansCode value.
          schema: {type: string, minLength: 1, maxLength: 4000}
        - in: query
          name: createdFrom
          description: Inclusive calendar date in YYYY-MM-DD format. Creation dates use UTC.
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$', minLength: 10, maxLength: 10}
        - in: query
          name: createdTo
          description: Inclusive calendar date in YYYY-MM-DD format. Creation dates use UTC.
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$', minLength: 10, maxLength: 10}
        - in: query
          name: issueFrom
          description: Inclusive calendar date in YYYY-MM-DD format. Creation dates use UTC.
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$', minLength: 10, maxLength: 10}
        - in: query
          name: issueTo
          description: Inclusive calendar date in YYYY-MM-DD format. Creation dates use UTC.
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$', minLength: 10, maxLength: 10}
        - in: query
          name: dueFrom
          description: Inclusive calendar date in YYYY-MM-DD format. Creation dates use UTC.
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$', minLength: 10, maxLength: 10}
        - in: query
          name: dueTo
          description: Inclusive calendar date in YYYY-MM-DD format. Creation dates use UTC.
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$', minLength: 10, maxLength: 10}
        - in: query
          name: totalMin
          description: Inclusive gross total bound in the selected currency. Requires currency.
          schema: {type: string, pattern: '^-?(0|[1-9][0-9]{0,23})(\.[0-9]{1,12})?$', minLength: 1, maxLength: 38}
        - in: query
          name: totalMax
          description: Inclusive gross total bound in the selected currency. Requires currency.
          schema: {type: string, pattern: '^-?(0|[1-9][0-9]{0,23})(\.[0-9]{1,12})?$', minLength: 1, maxLength: 38}
      responses:
        "200":
          description: Invoice page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvoicePage"}
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/invoices/filter-values:
    get:
      tags: [Invoices]
      operationId: listInvoiceFilterValues
      summary: Search distinct invoice filter values in the current library
      description: Requires invoices:read. Returns nonempty exact values across the current library, independently of active invoice filters. Search is literal and case-insensitive. Values are paginated in deterministic alphanumeric order. Cursors bind the library, field and trimmed query.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: field
          required: true
          schema: {type: string, enum: [number, seller, buyer, currency, typeCode, format, paymentMeansCode]}
        - in: query
          name: q
          schema: {type: string, maxLength: 200}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - in: query
          name: cursor
          schema: {type: string, minLength: 1, maxLength: 32768}
      responses:
        "200":
          description: Invoice filter value page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvoiceFilterValuePage"}
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/invoices/{id}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Read an extracted invoice and preceding invoice references
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Extracted invoice
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invoice"}
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/system/paperless-import:
    get:
      tags: [Paperless]
      operationId: getPaperlessSettings
      summary: Inspect installation retrieval concurrency (system:paperless:manage)
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Installation-wide Paperless retrieval settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperlessSettings"}
        default:
          $ref: "#/components/responses/BadRequest"
    put:
      tags: [Paperless]
      operationId: updatePaperlessSettings
      summary: Configure installation retrieval concurrency (system:paperless:manage)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdatePaperlessSettingsRequest"}
      responses:
        "200":
          description: Effective settings. Existing retrievals drain when the limit decreases.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperlessSettings"}
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/paperless-import:
    get:
      tags: [Paperless]
      operationId: getPaperlessOptions
      summary: Get Paperless import limits
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Import limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessOptions"
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/paperless-import/runs:
    get:
      tags: [Paperless]
      operationId: listPaperlessRuns
      summary: List your imports in this library
      description: Bounded history ordered by creation time and ID descending. Cursors bind the current owner, library and page size. Import summaries omit document outcomes; use listPaperlessOutcomes for the complete paginated result list.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: cursor
          schema: {type: string, minLength: 1, maxLength: 4096}
        - name: status
          in: query
          description: Filter before pagination. Cursors are bound to this filter. Partial means a succeeded run with failed files; succeeded excludes these runs.
          schema: {type: string, enum: [queued, running, succeeded, partial, failed, cancelled]}
        - name: activeOnly
          in: query
          description: Return only queued or running work (also enumerating for reindex batches). Counts remain unfiltered. Cursors bind this filter.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessRunPage"
        default:
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Paperless]
      operationId: startPaperlessRun
      summary: Queue a durable Paperless import
      description: Requires paperless:import and document read/upload permissions. Explicit background consent survives logout but ends on password or permission changes. Reuse requestId after an uncertain response. One import runs at a time, with paced source requests.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartPaperlessRun"}
      responses:
        "202":
          description: Import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessRun"
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/paperless-import/runs/{runId}:
    parameters:
      - in: path
        name: runId
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Paperless]
      operationId: getPaperlessRun
      summary: Read your import progress and latest one hundred outcomes
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessRun"
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/paperless-import/runs/{runId}/cancel:
    parameters:
      - in: path
        name: runId
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Paperless]
      operationId: cancelPaperlessRun
      summary: Stop accepting new documents; retain accepted documents
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessRun"
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/paperless-import/runs/{runId}/outcomes:
    parameters:
      - in: path
        name: runId
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Paperless]
      operationId: listPaperlessOutcomes
      summary: Read a page of completed document outcomes for your import
      description: Ordered by source ID descending. Optional status filtering is applied before pagination. Cursors bind owner, library, run, status and page size. Results are live; refresh from the first page to see newly completed documents.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: cursor
          schema: {type: string, minLength: 1, maxLength: 4096}
        - in: query
          name: status
          schema: {type: string, enum: [imported, duplicate, failed]}
      responses:
        "200":
          description: Completed document outcomes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperlessOutcomePage"}
        default:
          $ref: "#/components/responses/BadRequest"
  /api/v1/realtime:
    get:
      tags:
        - Realtime
      operationId: openRealtime
      summary: Open a bounded stream of authorized invalidation hints.
      description: >-
        Requires an HTTP/1.1 WebSocket upgrade with subprotocol domabas.realtime.v1,
        no query or body, and an approved browser Origin (native clients may omit Origin).
        Cookies and Authorization headers do not authenticate this operation. Send exactly one
        RealtimeAuthenticate text frame within five seconds after upgrade. A complete live session
        with realtime:connect in its active namespace is required. Every outgoing batch freshly
        checks session and feature authority; cross-library activity remains private to its owner.
        Only ready, invalidate, resync and heartbeat frames follow. Client data after authentication
        is forbidden. Server frames contain no resource identifiers or content and are at most
        512 UTF-8 bytes; authentication is at most 1024 bytes. Hints are best effort, without
        durable replay or sequence cursors. Subscribe before reading the REST baseline; reconnect
        and periodic authorized REST resync repair missed or coalesced hints. HTTP writes remain
        authoritative. Connections have a 30-minute lifetime, 20-second heartbeats and bounded queues.
        Close codes are 1000 normal, 1001 lifetime/shutdown, 1008 invalid protocol, 1009 oversized,
        1013 unavailable/overloaded, 4401 invalid/revoked session and 4403 missing connect authority.
      security: []
      x-websocket:
        subprotocol: domabas.realtime.v1
        client:
          $ref: '#/components/schemas/RealtimeAuthenticate'
        server:
          - $ref: '#/components/schemas/RealtimeReady'
          - $ref: '#/components/schemas/RealtimeInvalidation'
          - $ref: '#/components/schemas/RealtimeResync'
          - $ref: '#/components/schemas/RealtimeHeartbeat'
      responses:
        '101':
          description: WebSocket established; authenticate with the first frame before receiving hints.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /healthz:
    get:
      tags:
        - System
      operationId: health
      responses:
        "200":
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
      security:
        []
  /readyz:
    get:
      tags:
        - System
      operationId: readiness
      responses:
        "200":
          description: "PostgreSQL, the realtime listener, Temporal, document and email workers, durable storage, verified inference models and both dispatchers are ready. Missing email credential keys disable email operations without making ordinary document readiness fail."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"
      security:
        []
  /api/v1/documents:
    get:
      tags:
        - Documents
      operationId: listDocuments
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: cursor
          description: Opaque newest-first position bound to namespace and limit. Cannot be combined with a positive offset. Live edits may move records between pages.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        "200":
          description: "Documents ordered newest first by createdAt, then id descending."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Documents
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocument"
      responses:
        "201":
          description: Metadata created; no binary document is uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  "/api/v1/documents/{id}":
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a document (documents:read and documents:delete)
