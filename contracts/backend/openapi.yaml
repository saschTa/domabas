  /api/v1/documents/upload:
    post:
      tags:
        - Documents
      operationId: uploadDocument
      summary: Upload an original for durable OCR and embedding (documents:upload)
      description: "Exactly one file and one metadata JSON string part, in either order. Maximum file 100 MiB, metadata 32 KiB and multipart total 100 MiB + 64 KiB. PNG, JPEG and PDF signatures or bounded RFC 5322 email envelope framing are accepted; deeper content extraction is asynchronous, bounded to 200 PDF pages, 30 million pixels per image or rendered page, 20,000 inspected PDF objects and 2 MiB of extracted text. Exact EML originals remain retained when downstream body or part inspection fails. Duplicate bytes within the current namespace return 409 without a foreign namespace lookup."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - metadata
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  type: string
                  maxLength: 32768
                  description: "JSON object matching UploadDocumentMetadata; explicit nulls, unknown and duplicate fields are rejected."
      responses:
        "202":
          description: Original is durable and document plus ingestion outbox are committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
