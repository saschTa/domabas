      required: [key, value]
      properties:
        key:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 of the field, a NUL separator and the database comparison key. Never use as a search value.
        value:
          type: string
          minLength: 1
          maxLength: 320
    DocumentVocabularyPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DocumentVocabularyOption"
        nextCursor:
          type: string
          minLength: 1
          maxLength: 4096
    DocumentSearch:
      type: object
      additionalProperties: false
      required:
        - query
        - mode
      properties:
        query:
          type: string
          maxLength: 1000
          description: Trimmed term. Empty is permitted in hybrid and fulltext modes for filter-only browsing.
        mode:
          type: string
          enum:
            - fulltext
            - semantic
            - hybrid
        kinds:
          type: array
          maxItems: 3
          items:
            type: string
            enum: [document, letter, email]
          description: Match any selected document kind, combined with other filters using AND. Omitted, empty or all three kinds means all types. Order and duplicates have no effect. Applies before counts, pagination and semantic capacity admission. Email attachments retain their own document kind.
        tags:
          type: array
          items:
            type: string
            maxLength: 64
            minLength: 1
          maxItems: 20
          description: Every normalized tag must match.
        sender:
          type: string
          maxLength: 320
          description: Case-insensitive sender filter using PostgreSQL Unicode lowercase; percent and underscore are ordinary characters.
        senderMatch:
          type: string
          enum: [contains, exact]
          description: Sender matching mode. Omitted means contains. Exact selects the whole address value. A valid mode without a sender has no effect.
        recipient:
          type: string
          maxLength: 320
          description: Case-insensitive filter within any To, CC or BCC entry using PostgreSQL Unicode lowercase.
        recipientMatch:
          type: string
          enum: [contains, exact]
          description: Recipient matching mode, independent of senderMatch. Omitted means contains. A valid mode without a recipient has no effect.
        sort:
          type: string
          enum: [relevance, newest, oldest, title, date-newest, date-oldest]
          description: Defaults to relevance for a term and newest otherwise. Relevance requires a term. Title uses PostgreSQL Unicode lowercase ordering. Missing document dates sort last in both date orders. UUID breaks every tie.
        cursor:
          type: string
          minLength: 1
          maxLength: 4096
          description: Opaque position bound to the namespace, normalized criteria, sort and limit. Cannot be combined with a positive offset.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        offset:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
