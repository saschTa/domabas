  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested record does not exist in the current account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: "PostgreSQL, Temporal, the local worker, document storage, or model inference is unavailable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid. Login failures use invalid_credentials; protected operations use unauthorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The current claims do not authorize this operation or delegation, or initial password change is required (password_change_required)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "The requested identity change conflicts with current state, document bytes already exist in this namespace, or the document is not eligible for retry."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Credential, invitation, upload, or inference work is temporarily rate limited.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
    BodyTooLarge:
      description: The bounded request body exceeds its limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMedia:
      description: The request media type is unsupported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: One canonical 32-byte Base64URL bearer token in Authorization. New sessions have no routine expiry and remain revocable; retained finite sessions keep their deadlines. Browser cookies authenticate only POST /api/v1/auth/restore.
security:
  - BearerAuth:
      []
