  /api/v1/documents/vocabulary:
    get:
      tags:
        - Documents
      operationId: listDocumentVocabulary
      summary: List current library metadata values (documents:read and documents:search)
      description: Reads every live document in the authenticated library independently of active search filters. Tags retain their stored canonical value; addresses group by PostgreSQL Unicode lowercase and use the smallest C-collated display value. Query is a literal case-insensitive substring, with an empty query listing all values. Keys are opaque stable identities within a field. Cursors bind the operation, library, field, normalized query and limit; they are live positions rather than snapshots or authority. Unknown or repeated query parameters are rejected. Authentication and both claims are checked before validation, and current database authority is rechecked before resolving cursors.
      parameters:
        - in: query
          name: field
          required: true
          schema:
            type: string
            enum: [tag, sender, recipient]
        - in: query
          name: query
          allowEmptyValue: true
          schema:
            type: string
            default: ""
          description: Valid Unicode without controls after Go-compatible outer trimming, at most 320 scalars and 1280 UTF-8 bytes. An explicit empty value is legal.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 40
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        "200":
          description: A bounded page of distinct metadata values, ordered by the field's database comparison key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVocabularyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/documents/search:
    post:
      tags:
        - Documents
      operationId: searchDocuments
      summary: Search the current namespace (documents:search)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSearch"
      description: Hybrid combines plain-query exact and fuzzy word matching with semantic search. Relevance orders title/property matches before current-generation OCR matches, then semantic-only matches with cosine similarity at least 0.55. Every query lexeme must match for lexical discovery; words of at least four characters allow trigram similarity at least 0.3, while short and numeric terms require exact matches. Fulltext retains PostgreSQL simple web-search syntax. Empty hybrid/fulltext queries filter all documents; punctuation-only queries match none. Semantic search requires a nonempty term. Hybrid and semantic use the pinned English Nomic model and complete ready generations; unavailable inference fails without returning partial results. Semantic relevance uses approximate pgvector HNSW retrieval and exact reranking of candidate documents; exhaustive recall is not guaranteed. Selective or deep pages and explicit non-relevance sorts may use exact pgvector search. All filters, namespace ownership, current generation and model-space checks apply before candidate selection. There is no library chunk-count cutoff. Nonempty hybrid and semantic searches omit total; use nextCursor for continuation. Cursors are unsigned live positions, not authorization or cross-request snapshots.
      responses:
        "200":
          description: Results in the requested order, with an optional next cursor. When provided, total includes all matches before the cursor; semantic requests omit it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/system/document-processing/model-context:
