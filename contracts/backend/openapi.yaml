          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: sha256
          required: true
          description: Expected artifact output SHA-256 from the current document descriptor.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: JPEG at most 256 by 360 pixels and 262144 bytes. Private, no-store. Never returns an original.
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
                maximum: 262144
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
                maxLength: 262144
        "400":
          $ref: "#/components/responses/BadRequest"
