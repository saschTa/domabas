components:
  schemas:
    ChatConfigurationSummary:
      type: object
      additionalProperties: false
      required:
        - enabled
        - provider
        - model
        - revision
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum:
            - ollama
            - openai
        model:
          type: string
          minLength: 1
          maxLength: 200
        revision:
          type: integer
          format: int64
          minimum: 1
    ChatConfiguration:
      type: object
      additionalProperties: false
      required:
        - enabled
        - provider
        - model
        - revision
        - baseUrl
        - hasApiKey
        - contextLength
      properties:
        thinkingEnabled:
          type: boolean
          default: false
          description: Request model thinking for chat. Missing values mean false. Provider and model must support thinking control.
        contextLength:
          type: integer
          minimum: 1024
          maximum: 1048576
          description: Requested native Ollama context in tokens. Defaults to 32768 and is capped to the verified model maximum at inference. External providers manage their own context.
        enabled:
          type: boolean
        provider:
          type: string
          enum:
            - ollama
            - openai
        model:
          type: string
          minLength: 1
          maxLength: 200
        revision:
          type: integer
          format: int64
          minimum: 1
        baseUrl:
          type: string
          maxLength: 2048
        hasApiKey:
          type: boolean
    UpdateChatConfigurationRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - enabled
        - provider
        - model
        - baseUrl
      properties:
        thinkingEnabled:
          type: boolean
          description: Request model thinking for chat. Omission preserves the saved value.
        contextLength:
          type: integer
          minimum: 1024
          maximum: 1048576
          description: Requested native Ollama context in tokens. Omission preserves the saved value.
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        provider:
          type: string
          enum:
            - ollama
            - openai
        model:
          type: string
          minLength: 1
          maxLength: 200
        baseUrl:
          type: string
          maxLength: 2048
        apiKey:
          type: string
          nullable: true
          writeOnly: true
          description: Omit or send null to retain the current key for an unchanged provider and endpoint.
          minLength: 1
          maxLength: 4096
        clearApiKey:
          type: boolean
          nullable: true
          description: Only true removes the stored key; omitted or null preserves it.
    OllamaModelContext:
      type: object
      additionalProperties: false
      required: [model, maxContextLength]
      properties:
        model: {type: string}
        maxContextLength:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Positive integral context maximum reported for this model's architecture by Ollama.
    ChatModel:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
    ChatModelPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatModel"
        nextOffset:
          type: integer
          minimum: 0
    CreateChatConversationRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          format: uuid
    ChatConversation:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activeTurnId:
          type: string
          format: uuid
    ChatConversationPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatConversation"
        nextCursor:
          type: string
    SendChatMessageRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - content
      properties:
        requestId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 8000
    ChatSource:
      type: object
      additionalProperties: false
      required:
        - documentId
        - title
        - excerpt
      properties:
        documentId:
          type: string
          format: uuid
        title:
          type: string
        excerpt:
          type: string
          maxLength: 500
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - conversationId
        - sequence
        - role
        - content
        - createdAt
        - updatedAt
        - turnId
        - status
        - stage
        - provider
        - model
        - sources
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        turnId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
            - cancelled
        stage:
          type: string
          enum:
            - queued
            - waiting_for_ingestion
            - preparing
            - generating
            - searching_documents
            - reading_document
            - completed
            - failed
            - cancelled
        failureCode:
          type: string
        provider:
          type: string
          enum:
            - ollama
            - openai
        model:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ChatSource"
          maxItems: 80
    ChatMessagePage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        nextCursor:
          type: string
    ChatAcceptedTurn:
      type: object
      additionalProperties: false
      required:
        - userMessage
        - assistantMessage
      properties:
        userMessage:
          $ref: "#/components/schemas/ChatMessage"
        assistantMessage:
          $ref: "#/components/schemas/ChatMessage"
    InvoiceParty:
      type: object
      required: [name, taxId, registrationId, address, country, email]
      properties:
        name: {type: string}
        taxId: {type: string}
        registrationId: {type: string}
        address: {type: string}
        country: {type: string}
        email: {type: string}
    InvoiceLine:
      type: object
      required: [id, description, quantity, unitCode, unitPrice, netAmount, taxCategory, taxRate]
      properties:
        id: {type: string}
        description: {type: string}
        quantity: {type: string}
        unitCode: {type: string}
        unitPrice: {type: string}
        netAmount: {type: string}
        taxCategory: {type: string}
        taxRate: {type: string}
    InvoiceTax:
      type: object
      required: [category, rate, taxableAmount, taxAmount, exemptionReason]
      properties:
        category: {type: string}
        rate: {type: string}
        taxableAmount: {type: string}
        taxAmount: {type: string}
        exemptionReason: {type: string}
    InvoiceAllowance:
      type: object
      required: [reason, amount, taxCategory, taxRate, charge]
      properties:
        reason: {type: string}
        amount: {type: string}
        taxCategory: {type: string}
        taxRate: {type: string}
        charge: {type: boolean}
    InvoiceReference:
      type: object
      required: [number, issueDate]
      properties:
