        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/v1/documents/{id}/ocr":
    get:
      tags: [Documents]
      operationId: getDocumentOCR
      summary: Read exact effective OCR (documents:read and documents:ocr:read)
      parameters: *parameters
      responses:
        "200":
          description: Exact effective text or its availability reason, with semantic indexing status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOCR"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [Documents]
      operationId: updateDocumentOCR
      summary: Correct OCR (documents:read, documents:ocr:read and documents:ocr:update)
      parameters: *parameters
      description: Requires the observed revision. Stores exact UTF-8 text without NUL, at most 2 MiB and 2048 derived chunks. Empty corrections are valid. Rebuilds lexical search atomically and durably schedules semantic indexing. Rejects duplicate/unknown fields, null, trailing JSON and invalid Unicode escapes. JSON envelope is limited to 12587008 bytes. Metadata-only documents and revision mismatch return conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentOCR"
      responses:
        "200":
          description: Saved canonical correction and current indexing state.
          content:
            application/json:
              schema:
