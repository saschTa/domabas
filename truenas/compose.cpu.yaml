x-settings:
  postgres_memory_limit: &postgres-memory-limit 2g
  backend_memory_limit: &backend-memory-limit 2g
  backend_go_memory_limit: &backend-go-memory-limit 1536MiB
  web_memory_limit: &web-memory-limit 512m
  embedding_queue_size: &embedding-queue-size "128"
  postgres_admin_password: &postgres-admin-password ""
  postgres_password: &postgres-password ""
  web_bind_address: &web-bind-address 0.0.0.0
  web_port: &web-port "8088"
  public_origin: &public-origin https://domabas.example.com
  dataset_path: &dataset-path /mnt/POOL/domabas

x-init: &init
  user: "950:950"
  image: domabas-init:native-local
  platform: linux/amd64
  restart: "no"

x-database-environment: &database-environment
  POSTGRES_ADMIN_USER: domabas_admin
  POSTGRES_ADMIN_PASSWORD: *postgres-admin-password
  POSTGRES_DB: domabas
  POSTGRES_USER: domabas
  POSTGRES_PASSWORD: *postgres-password

services:
  storage-init:
    <<: *init
    network_mode: none
    read_only: true
    entrypoint: [bun, --no-env-file, --eval]
    command:
      - |
        import { chmodSync, existsSync, lstatSync, mkdirSync } from "node:fs";

        const directories = [
          ["postgres", 0o700],
          ["ingestion", 0o700],
          ["documents", 0o700],
          ["secrets", 0o700],
          ["tesseract", 0o700],
          ["embedding", 0o755],
        ] as const;

        for (const [name] of directories) {
          const path = "/storage/" + name;
          const existing = lstatSync(path, { throwIfNoEntry: false });
          if (existing && !existing.isDirectory()) {
            throw new Error("Storage path must be a directory, not a symlink or file: " + path);
          }
          if (existing && existing.uid !== process.getuid()) {
            throw new Error("Existing storage must be owned by UID 950. Correct ownership in TrueNAS: " + path);
          }
        }

        for (const [name, mode] of directories) {
          const path = "/storage/" + name;
          if (!existsSync(path)) mkdirSync(path, { mode });
          chmodSync(path, mode);
          console.log("Prepared storage directory: " + name);
        }
    volumes:
      - type: bind
        source: *dataset-path
        target: /storage
        bind: {create_host_path: false}

  postgres:
    mem_limit: *postgres-memory-limit
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    user: "950:950"
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: domabas_admin
      POSTGRES_PASSWORD: *postgres-admin-password
    depends_on:
      storage-init: {condition: service_completed_successfully}
    volumes:
      - type: volume
        source: domabas-storage
        target: /var/lib/postgresql
        volume: {subpath: postgres, nocopy: true}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 30s

  database-init:
    <<: *init
    command: [databases]
    environment: *database-environment
    depends_on:
      postgres: {condition: service_healthy}

  model-init:
    <<: *init
    command: [embedding-model]
    depends_on:
      storage-init: {condition: service_completed_successfully}
    volumes:
      - type: volume
        source: domabas-storage
        target: /models/embedding
        volume: {subpath: embedding, nocopy: true}

  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
    user: "950:950"
    restart: unless-stopped
    command: ["--model", "/models/embedding/nomic-embed-text-v1.5.f16.gguf", "--alias", "nomic-embed-text:v1.5", "--embedding", "--pooling", "mean", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "2048", "--batch-size", "2048", "--ubatch-size", "2048", "--parallel", "1"]
    depends_on:
      model-init: {condition: service_completed_successfully}
    volumes:
      - type: volume
        source: domabas-storage
        target: /models/embedding
        read_only: true
        volume: {subpath: embedding, nocopy: true}
    cpus: 4
    mem_limit: 2g
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8080/health]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  document-processor:
    user: "950:950"
    image: domabas-document-processor:native-local
    platform: linux/amd64
    restart: unless-stopped
    environment:
      HTTP_ADDR: 0.0.0.0:8091
      TMPDIR: /var/tmp
      MODEL_CACHE_ROOT: /models/tesseract
      EMBEDDING_MODEL_PATH: /models/embedding/nomic-embed-text-v1.5.f16.gguf
      EMBEDDING_URL: http://embeddings:8080
      EMBEDDING_QUEUE_SIZE: *embedding-queue-size
    volumes:
      - type: volume
        source: domabas-storage
        target: /models/tesseract
        volume: {subpath: tesseract, nocopy: true}
      - type: volume
        source: domabas-storage
        target: /models/embedding
        read_only: true
        volume: {subpath: embedding, nocopy: true}
    tmpfs:
      - /tmp:size=2147483648,mode=1777
    cpus: 4
    mem_limit: 4g
    pids_limit: 256
    depends_on:
      storage-init: {condition: service_completed_successfully}
      embeddings: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8091/readyz]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10m
    stop_grace_period: 30s

  backend:
    mem_limit: *backend-memory-limit
    user: "950:950"
    image: domabas-backend:native-local
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: host=postgres port=5432 sslmode=disable
      PGUSER: domabas
      PGPASSWORD: *postgres-password
      PGDATABASE: domabas
      HTTP_ADDR: 0.0.0.0:8080
      GOMEMLIMIT: *backend-go-memory-limit
      CORS_ORIGINS: *public-origin
      EMBEDDING_QUEUE_SIZE: *embedding-queue-size
      LLM_CREDENTIAL_KEY_FILE: /var/lib/domabas/secrets/llm.key
      DOCUMENT_PROCESSOR_URL: http://document-processor:8091
      DOCUMENT_INGESTION_ROOT: /data/ingestion
      DOCUMENT_STORAGE_ROOT: /data/documents
      EMAIL_CREDENTIAL_KEY_FILE: /var/lib/domabas/secrets/email.key
      PAPERLESS_CREDENTIAL_KEY_FILE: /var/lib/domabas/secrets/paperless.key
    volumes:
      - type: volume
        source: domabas-storage
        target: /data/ingestion
        volume: {subpath: ingestion, nocopy: true}
      - type: volume
        source: domabas-storage
        target: /data/documents
        volume: {subpath: documents, nocopy: true}
      - type: volume
        source: domabas-storage
        target: /var/lib/domabas/secrets
        volume: {subpath: secrets, nocopy: true}
    depends_on:
      storage-init: {condition: service_completed_successfully}
      database-init: {condition: service_completed_successfully}
      document-processor: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", http://127.0.0.1:8080/readyz]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 3
      start_period: 10m
    stop_grace_period: 60s

  web:
    mem_limit: *web-memory-limit
    user: "950:950"
    tmpfs:
      - /var/cache/nginx:uid=950,gid=950,mode=0700
      - /var/run:uid=950,gid=950,mode=0755
    image: domabas-web:native-local
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - target: 8080
        published: *web-port
        host_ip: *web-bind-address
        protocol: tcp
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/healthz]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  domabas-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: *dataset-path
